name: CI

on:
  push:
  pull_request:

jobs:
  extension-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Packaging tools (@vscode/vsce's Azure dependencies, @vscode/test-electron) require Node 22; the runtime package itself supports Node 20.
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: extensions/vscode
      - run: npm run package
        working-directory: extensions/vscode
      - uses: actions/upload-artifact@v4
        with:
          name: forge-vscode-extension
          path: extensions/vscode/*.vsix
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint:terms
      - run: npm run lint:spec
      - run: npm run validate:handoff examples/example-handoff.md
      - run: npm run validate:handoff examples/review-handoff.md
      - run: npm run validate:handoff docs/handoff-template.md
      - run: npm run validate:handoff docs/roadmap/0.6-cleanup.md
      - run: npm run validate:handoff docs/roadmap/0.7-verification-boundary.md
      - run: npm run validate:handoff docs/roadmap/0.8-key-dogfood.md
      - run: npm run validate:handoff docs/roadmap/0.9-beta.md
      - run: npm run validate:handoff docs/roadmap/ext-0.9-marketplace.md
      - run: npm run validate:handoff docs/roadmap/key-0.11-beta.md
      - run: npm run validate:handoff docs/roadmap/site-studio.md
      - run: npm run validate:handoff docs/roadmap/1.0-release.md
      - run: npm test
      - run: npm run test:acceptance -- --out "${{ runner.temp }}/acceptance-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-results-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/acceptance-results/report.*
            ${{ runner.temp }}/acceptance-results/*/contract.json
            ${{ runner.temp }}/acceptance-results/*/invocation.json
            ${{ runner.temp }}/acceptance-results/*/execution-events.txt
            ${{ runner.temp }}/acceptance-results/*/receipt/*
  # Installs the packed tarball into an empty project and runs the installed forge command.
  package-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install into an empty project
        working-directory: ${{ runner.temp }}
        run: |
          mkdir app && cd app
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/forge-framework-*.tgz
      - name: Run the installed forge command
        working-directory: ${{ runner.temp }}/app
        run: |
          npx forge --help | tee help.txt
          for command in validate bind receipt lint; do grep -q "^  $command " help.txt; done
          cp "$GITHUB_WORKSPACE/examples/example-handoff.md" "$GITHUB_WORKSPACE/examples/example-handoff.contract.json" .
          npx forge validate example-handoff.md
          npx forge validate example-handoff.md --level HC-3 --contract example-handoff.contract.json
          node -e "const forge = require('forge-framework'); if (typeof forge.createReceipt !== 'function') process.exit(1)"
  # Forge's own CI verified by the Key verifier (spec/verification-interface.md).
  # Step names derive the gate IDs in key/key-contract.yaml; keep them in sync.
  key-verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The runner context is not available in job-level env, so the paths are set here.
      - name: Set Key paths
        shell: bash
        run: |
          echo "KEY_HOME=${{ runner.temp }}/key" >> "$GITHUB_ENV"
          echo "KEY_RUN=${{ runner.temp }}/key-run" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          # Exact version: the trusted-program allowlists in key/ pin this node binary's hash.
          node-version: 20.20.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Key dependencies
        run: python -m pip install PyYAML==6.0.3 jsonschema==4.26.0
      - name: Install pinned Key release
        run: node scripts/key-verify.js install
      - name: Term lint
        run: node scripts/key-verify.js gate term_lint_gate
      - name: Spec structure
        run: node scripts/key-verify.js gate spec_structure_gate
      - name: Handoff conformance
        run: node scripts/key-verify.js gate handoff_conformance_gate
      - name: Unit tests
        run: node scripts/key-verify.js gate unit_tests_gate
      - name: Acceptance harness
        run: node scripts/key-verify.js gate acceptance_harness_gate
      - name: Verify run with Key
        run: node scripts/key-verify.js verify
      - name: Gate bypass drill
        run: node scripts/key-verify.js drill
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: key-run-${{ matrix.os }}
          path: ${{ runner.temp }}/key-run
